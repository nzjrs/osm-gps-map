name: Pages

# Tag is enough to publish (gtk-doc + Jekyll). A GitHub Release is
# required only for the landing-page Download / News list.
on:
  push:
    branches:
      - master
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install gtk-doc dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            gtk-doc-tools \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libgirepository1.0-dev

      - name: Build documentation
        run: |
          ./autogen.sh --prefix=/usr --enable-gtk-doc
          make -j"$(nproc)"
          test -d docs/reference/html

      - name: Write releases data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/releases-data.py \
            --repo "${{ github.repository }}" \
            --out website/_data/releases.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: website

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        working-directory: website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Copy gtk-doc into site
        run: |
          mkdir -p website/_site/docs/reference
          rm -rf website/_site/docs/reference/html
          cp -a docs/reference/html website/_site/docs/reference/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
