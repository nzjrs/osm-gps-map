name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            gtk-doc-tools \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libgirepository1.0-dev \
            python3-gi \
            python3-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-gdkpixbuf-2.0 \
            xvfb

      - name: Build
        run: |
          ./autogen.sh --prefix=/usr
          make -j"$(nproc)"

      - name: make check
        run: make check

      - name: make distcheck
        run: make distcheck

      - name: Install and run Python tests
        run: |
          sudo make install
          xvfb-run --auto-servernum python3 -m unittest discover -v tests/
